html/head_include="<style>#rot{display:none;position:fixed;inset:0;z-index:9999;background:#14141b;color:#e8e8ee;font:600 21px system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px}@media (orientation:portrait){#rot{display:flex}}#rot .ph{width:54px;height:94px;border:4px solid #ff7333;border-radius:11px;box-sizing:border-box;animation:rotph 2.2s ease-in-out infinite}@keyframes rotph{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}#rot small{color:#9a9aab;font-weight:500;font-size:16px;line-height:1.5}</style>
<script>document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rot';d.innerHTML='<div class=ph></div><div>Turn your phone sideways to play</div><small>Vire o celular de lado para jogar<br>Gira el teléfono para jugar</small>';document.body.appendChild(d);});
function rfLock(){document.removeEventListener('pointerdown',rfLock);try{var e=document.documentElement;if(!e.requestFullscreen||!screen.orientation||!screen.orientation.lock)return;e.requestFullscreen().then(function(){return screen.orientation.lock('landscape');}).catch(function(){});}catch(x){}}
document.addEventListener('pointerdown',rfLock);</script>"
